<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mi propia web de música.">
    <title>Mi reproductor de música</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header id="cabecera">
        <h1>Reproductor de música</h1>
        <p>Bienvenido a mi reproductor de música.</p>
    </header>
    <nav  id="menu">
        <ul id="contenedor_li">
            
        </ul>
    </nav>
    <main id="principal">
        <script>
            async function cargar() {
                const generos = [];
                const respuesta = await fetch("mp3/canciones.json", { cache: "no-store" });
                const canciones = await respuesta.json();
                const amor = document.getElementById("amor");
                const desamor = document.getElementById("desamor");
                const fiesta = document.getElementById("fiesta");
                const motivador = document.getElementById("motivador");


                for (const cancion of canciones) {
                    if (!generos.includes(cancion.tema)) {
                        generos.push(cancion.tema);
                    }

                }

                const main = document.getElementById("principal");
                const ul = document.getElementById("contenedor_li");
                for (let tema of generos) {
                    const li = document.createElement("li");
                    const a = document.createElement("a");
                    a.setAttribute("href", `#${tema}`);
                    a.textContent = tema;
                    li.appendChild(a);
                    ul.appendChild(li);

                    const seccion = document.createElement("section");
                    const h2 = document.createElement("h2");
                    seccion.id = tema;
                    h2.textContent = `Canciones de ${tema}`;
                    seccion.appendChild(h2);
                    main.appendChild(seccion);
                }

                for (const cancion of canciones) {
                    const contenedor = document.createElement("article");
                    const titulo = document.createElement("h3");
                    const audio = document.createElement("audio");

                    
                    const caja = document.getElementById(cancion.tema);
                    titulo.textContent = cancion.titulo;
                    audio.controls = true;
                    audio.preload = "none";
                    audio.src = cancion.archivo;
                    contenedor.append(titulo, audio);
                    caja.appendChild(contenedor);
                     
                }
            }
            cargar();
        </script>
    </main>
</body>

</html>
